services:
  evidence:
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: evidence } }
    ports: ["8083:8080"]
  generator:
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: generator } }
    ports: ["8081:8080"]
  runtime:
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: runtime } }
    ports: ["8082:8080"]
  control-plane:
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: control_plane } }
    environment: { GENERATOR_URL: "http://generator:8080", RUNTIME_URL: "http://runtime:8080", EVIDENCE_URL: "http://evidence:8080" }
    ports: ["8080:8080"]
    depends_on: [generator, runtime, evidence]
  web:
    build: app
    ports: ["8088:80"]

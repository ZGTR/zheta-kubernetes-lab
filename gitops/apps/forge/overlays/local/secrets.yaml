apiVersion: v1
kind: Secret
metadata: { name: runtime-secrets, namespace: zheta-forge }
stringData: { SERVICE_TOKEN: local-service-token-32-characters-minimum, RUNTIME_DATABASE_URL: sqlite:////data/runtime.db }
---
apiVersion: v1
kind: Secret
metadata: { name: evidence-secrets, namespace: zheta-forge }
stringData: { SERVICE_TOKEN: local-service-token-32-characters-minimum, EVIDENCE_DATABASE_URL: sqlite:////data/evidence.db, BROKER_SUBSCRIPTION: http://broker:8080 }
---
apiVersion: v1
kind: Secret
metadata: { name: broker-secrets, namespace: zheta-forge }
stringData: { SERVICE_TOKEN: local-service-token-32-characters-minimum, BROKER_DATABASE_URL: sqlite:////data/broker.db }

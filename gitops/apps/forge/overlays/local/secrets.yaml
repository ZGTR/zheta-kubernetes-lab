apiVersion: v1
kind: Secret
metadata: { name: control-plane-secrets, namespace: zheta-forge }
stringData:
  SERVICE_TOKEN: local-service-token-32-characters-minimum
  JWT_SECRET: local-jwt-secret-32-characters-minimum
  CONTROL_DATABASE_URL: sqlite:////data/control.db
  ARTIFACT_DATABASE_URL: sqlite:////data/artifacts.db
  BROKER_TOPIC: http://broker:8080

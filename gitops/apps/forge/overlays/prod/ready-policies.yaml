apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: control-plane, namespace: zheta-forge }
spec: { minAvailable: 2, selector: { matchLabels: { app.kubernetes.io/name: control-plane } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: control-plane, namespace: zheta-forge }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: control-plane }
  minReplicas: 3
  maxReplicas: 20
  behavior: { scaleDown: { stabilizationWindowSeconds: 600 } }
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]

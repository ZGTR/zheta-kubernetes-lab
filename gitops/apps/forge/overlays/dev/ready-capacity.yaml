apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: forge-apps }
spec:
  limits: { cpu: "100" }
  disruption: { consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 5m }
  template:
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: forge-apps }
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: { name: forge-apps }
spec:
  role: zheta-forge-dev-nodes
  amiSelectorTerms: [{ tags: { ZhetaForgeAmi: approved-dev } }]
  subnetSelectorTerms: [{ tags: { karpenter.sh/discovery: zheta-forge-dev } }]
  securityGroupSelectorTerms: [{ tags: { aws:eks:cluster-name: zheta-forge-dev } }]

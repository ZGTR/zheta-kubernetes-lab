apiVersion: apps/v1
kind: Deployment
metadata:
  name: helixworks
  namespace: helixworks
  labels:
    app.kubernetes.io/name: helixworks
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helixworks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helixworks
    spec:
      containers:
        - name: web
          image: helixworks-demo:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi


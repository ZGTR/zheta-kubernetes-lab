apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: karpenter, namespace: argocd }
spec:
  project: forge
  source: { repoURL: "oci://public.ecr.aws/karpenter", chart: karpenter, targetRevision: 1.5.2, helm: { releaseName: karpenter, valuesObject: { settings: { clusterName: zheta-forge-prod } } } }
  destination: { server: "https://kubernetes.default.svc", namespace: karpenter }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
